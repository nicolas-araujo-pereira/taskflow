<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/auth.css">
    <title>Cadastro | TaskFlow </title>
</head>
<body>
    <main class="cadastro">
        <div class="hero">
            <h1>Task<span id="flow">Flow</span></h1>            
            <div class="indicador">
                <span class="lua">☾</span>
                <span class="sol">☀︎</span>
            </div>            
        </div>
        <h2>Crie sua conta</h2>
        <p>Organize suas tarefas e acompanhe o seu progresso</p>
        <form>
            <div class="container-input">
                <label>Nome</label>
                <input type="text" placeholder="Seu nome" class="nome"/>                
            </div>
            <div class="container-input">
                <label>Senha</label>
                <input type="password" placeholder="Mínimo 4 caracteres" class="senha"/>                
            </div>
            <div class="container-input">
                <label>Confirmar Senha</label>
                <input type="password" placeholder="Digite a senha novamente" class="cSenha" />                
            </div>

            <button type="button" class="criar">Criar conta</button>
        </form>
        <p>Já tem uma conta ? <a>Entrar</a></p>
    </main>
</body>

<script src="./js/lightDark.js"></script>
<script type="module" src="./js/cadastro.js"></script>
</html>
